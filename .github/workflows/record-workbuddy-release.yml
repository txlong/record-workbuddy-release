name: Record WorkBuddy Release

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: record-workbuddy-release
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch and record release
        run: python scripts/record_workbuddy_release.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: record workbuddy release"
          file_pattern: README.md data/releases.json data/latest.json data/changelog.json
